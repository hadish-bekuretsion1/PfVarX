[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"
[project]
name = "pfvarx"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []
[project.scripts]
pfvarx = "pfvarx.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/pfvarx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end runs that need the pixi bioinformatics tools (slow)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "B023", "B007"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
