version: "1.2.0"
parameters:
  min_mapping_quality: {value: 20, source: UNCALIBRATED_PROVISIONAL, note: "grid {1,10,20,30}; Experiment C"}
  min_base_quality: {value: 13, source: UNCALIBRATED_PROVISIONAL, note: "grid {10,13,20}; Experiment C"}
  window_size_bp: {value: 5000, source: UNCALIBRATED_PROVISIONAL, note: "grid {2,5,10} kb"}
  min_usable_depth: {value: 5, source: LITERATURE_SUPPORTED, note: "MalariaGEN Pf7 2023 and Pf8 2025: positions need >=5 reads to be callable and no allele fraction is computed below 5 reads"}
  screening_threshold_neglog10: {value: 6.0, source: UNCALIBRATED_PROVISIONAL, note: "lambda(m): largest value retaining >=99% truth SNPs and indels"}
  error_mean_default: {value: 0.005, source: UNCALIBRATED_PROVISIONAL, note: "used only until the per-mode error model is fitted"}
  overdispersion_phi_default: {value: 200.0, source: UNCALIBRATED_PROVISIONAL, note: "mode-level phi(m) until fitted"}
  known_ref_trim_fraction: {value: 0.025, source: UNCALIBRATED_PROVISIONAL, note: "grid {0.01,0.025,0.05}"}
  pass_min_fragments: {value: 2, source: LITERATURE_SUPPORTED, note: "MalariaGEN Pf7 2023: an allele seen in fewer than 2 reads is treated as absent"}
  pass_min_neglog10: {value: 10.0, source: UNCALIBRATED_PROVISIONAL, note: "PASS operating point; Experiment C"}
  strand_bias_max_neglog10: {value: 8.0, source: UNCALIBRATED_PROVISIONAL, note: "Fisher exact strand test; Experiment C"}
  pairhmm_gap_open: {value: 0.001, source: UNCALIBRATED_PROVISIONAL, note: "initial value; refit per mode"}
  pairhmm_gap_extend: {value: 0.1, source: UNCALIBRATED_PROVISIONAL}
  k_max: {value: 3, source: UNCALIBRATED_PROVISIONAL, note: "grid {3,4,5}; Experiments F and M"}
  em_tolerance: {value: 1.0e-8, source: FRAMEWORK_POLICY}
  em_max_iterations: {value: 1000, source: FRAMEWORK_POLICY}
  em_restarts: {value: 20, source: FRAMEWORK_POLICY}
  em_restart_agreement: {value: 1.0e-4, source: FRAMEWORK_POLICY}
  k_test_alpha: {value: 0.05, source: LITERATURE_SUPPORTED, note: "conventional level; over-selection measured"}
  k_bootstrap_replicates_analysis: {value: 39, source: UNCALIBRATED_PROVISIONAL, note: "used only when no precomputed critical-value surface exists; outputs labelled; 39 is the smallest B for which p < 0.05 is attainable"}
  mixture_min_component_weight: {value: 0.02, source: UNCALIBRATED_PROVISIONAL, note: "components below this DNA proportion are treated as unidentified; Experiments F and M"}
  mixture_informative_min_sites: {value: 20, source: UNCALIBRATED_PROVISIONAL}
  wsaf_interval_level: {value: 0.95, source: FRAMEWORK_POLICY}
  candidate_min_alt_reads: {value: 2, source: FRAMEWORK_POLICY, note: "reads carrying an allele before it is screened; PASS separately needs pass_min_fragments"}
  pairhmm_max_reads: {value: 200, source: FRAMEWORK_POLICY, note: "runtime cap on reads re-scored per indel candidate"}
  pairhmm_flank_bp: {value: 60, source: FRAMEWORK_POLICY, note: "reference flank on each side of the indel haplotypes"}
  error_fit_exclude_fraction: {value: 0.05, source: FRAMEWORK_POLICY, note: "sites with >= pass_min_fragments reads and >= this fraction for a non-reference allele are left out of the error-model fit, with a truncated likelihood; MalariaGEN Pf7 treats alleles below 5% of reads as absent"}
  mixture_site_spacing_bp: {value: 500, source: FRAMEWORK_POLICY, note: "minimum distance between PASS SNVs used by the mixture model (a linkage proxy)"}
  mixture_indel_exclusion_bp: {value: 10, source: FRAMEWORK_POLICY, note: "SNVs this close to a called indel are left out of the mixture model (alignment artefacts beside indels); calls are unchanged"}
  mixture_constrained_calling: {value: false, source: FRAMEWORK_POLICY, note: "pass-two: promote LOW_CONFIDENCE candidates whose reads fit an allowed clone fraction; off until benchmarked"}
  mixture_constrained_min_log10_lr: {value: 10.0, source: UNCALIBRATED_PROVISIONAL, note: "log10 LR of the best allowed clone fraction against error needed for promotion; to be set from simulated mixtures"}
  focal_loss_min_length_bp: {value: 50, source: UNCALIBRATED_PROVISIONAL, note: "shortest low-depth run reported as focal callability loss"}
  homopolymer_tract_classes: {value: [[1, 1], [2, 4], [5, 9], [10, 10000]], source: FRAMEWORK_POLICY, note: "homopolymer run lengths (bp, inclusive) that each get their own indel error model; the last class also takes every longer run"}
  indel_error_init_divisor: {value: 5, source: FRAMEWORK_POLICY, note: "starting indel error rate = error_mean_default / this, before each tract class is fitted"}
  indel_error_floor: {value: 1.0e-6, source: FRAMEWORK_POLICY, note: "smallest fitted indel error rate used"}
  error_rate_cap: {value: 0.25, source: FRAMEWORK_POLICY, note: "largest per-allele error rate used for WSAF intervals and constrained scoring (0.25: all four bases equally likely)"}
  error_fit_min_sites: {value: 50, source: FRAMEWORK_POLICY, note: "known-reference sites needed to fit the error model; with fewer, error_mean_default and overdispersion_phi_default are used"}
  error_fit_min_nonzero_for_phi: {value: 50, source: FRAMEWORK_POLICY, note: "sites with error reads needed to estimate phi; with fewer, mu is fitted and phi stays at overdispersion_phi_default"}
  overdispersion_phi_bounds: {value: [10.0, 1.0e+7], source: FRAMEWORK_POLICY, note: "range of the fitted phi; the lower bound (intra-sample correlation <= 0.09) because near-all-zero data cannot identify stronger overdispersion"}
  wsaf_profile_grid_points: {value: 2001, source: FRAMEWORK_POLICY, note: "grid points on [0, 1] for the profile-likelihood WSAF estimate and interval (step 0.0005)"}
  indel_anchor_bp: {value: 5, source: FRAMEWORK_POLICY, note: "a read re-scored for an indel must cover this many reference bases on each side of the event"}
  pileup_max_depth: {value: 1000000, source: FRAMEWORK_POLICY, note: "pysam pileup depth cap, far above any expected depth so that no read is dropped"}
  evidence_chunk_bp: {value: 250000, source: FRAMEWORK_POLICY, note: "work unit for parallel evidence collection; results do not depend on it"}
  k_bootstrap_max_iterations: {value: 200, source: FRAMEWORK_POLICY, note: "EM iteration cap for the bootstrap replicate fits of the K test (never above em_max_iterations)"}
  k_bootstrap_restart_divisor: {value: 10, source: FRAMEWORK_POLICY, note: "bootstrap replicate fits use em_restarts / this EM starts, and at least k_bootstrap_min_restarts"}
  k_bootstrap_min_restarts: {value: 2, source: FRAMEWORK_POLICY}
  pairhmm_support_min_log10_ratio: {value: 1.0, source: FRAMEWORK_POLICY, note: "a read supports the indel (or the reference) when its log10 likelihood ratio for that haplotype is at least this; reads in between are uninformative"}
  linkage_min_fragments: {value: 2, source: FRAMEWORK_POLICY, note: "fragments that must carry two alternative alleles together before they are joined into one linkage block"}
  em_min_agreeing_starts: {value: 2, source: FRAMEWORK_POLICY, note: "EM starts that must reach the best log-likelihood (within em_restart_agreement) for a mixture fit to count as stable"}
  em_mstep_logit_bound: {value: 30.0, source: FRAMEWORK_POLICY, note: "bound on each component's log-weight ratio in the M-step optimiser (a weight ratio of e^30 is far beyond any identifiable component)"}
  em_mstep_max_iterations: {value: 50, source: FRAMEWORK_POLICY, note: "L-BFGS-B iterations per M-step; EM itself runs to em_tolerance or em_max_iterations"}
  genotype_alt_min_wsaf: {value: 0.5, source: FRAMEWORK_POLICY, note: "the haploid GT is the dominant allele: ALT when WSAF is at least this. Also the dominant allele used by diversity (DA003) and phylogeny (DA006)"}
  vcf_qual_cap: {value: 9999, source: FRAMEWORK_POLICY, note: "largest QUAL written to the VCF (the screen statistic, -log10); larger values are written as this"}
