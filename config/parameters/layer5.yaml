version: "1.0.0"
parameters:
  da001_credibility: {value: 0.95, source: UNCALIBRATED_PROVISIONAL, note: "candidate {0.90,0.95}"}
  da001_min_informative_loci: {value: 10, source: UNCALIBRATED_PROVISIONAL}
  population_frequency_min_samples: {value: 10, source: UNCALIBRATED_PROVISIONAL, note: "FWS and the MOIRE COI count use allele frequencies estimated from the analysed samples; each sample is 1/n of its own reference frequency (n=1 gives FWS 0 exactly), so both are withheld below this many samples. P(COI>1) and the clonality call are kept"}
  da001_fws_reference_cutoff: {value: 0.95, source: LITERATURE_SUPPORTED, note: "Fws >= 0.95 as the conventional proxy for a clonal infection (Manske 2012; Auburn 2012; MalariaGEN Pf7 2023, Pf8 2025); reported for comparison only"}
  da006_min_monoclonal: {value: 4, source: FRAMEWORK_POLICY, note: "mathematical floor for an informative unrooted topology"}
  da006_min_informative_sites: {value: 10, source: UNCALIBRATED_PROVISIONAL}
  da006_max_sample_missing: {value: 0.2, source: UNCALIBRATED_PROVISIONAL}
  da006_max_site_missing: {value: 0.2, source: UNCALIBRATED_PROVISIONAL}
  da006_ufboot: {value: 1000, source: LITERATURE_SUPPORTED, note: "IQ-TREE; rely on a branch only at UFBoot >= 95 and SH-aLRT >= 80 (Hoang 2018; Guindon 2010)"}
  da006_alrt: {value: 1000, source: LITERATURE_SUPPORTED}
  da004_min_informative_markers: {value: 200, source: LITERATURE_SUPPORTED, note: "Taylor 2019: about 200 biallelic markers keep relatedness error below 0.1. Minimum for WGS; for every design, pairs below it are ESTIMATED_LOW_PRECISION and get no relatedness label"}
  da004_min_informative_markers_targeted: {value: 20, source: UNCALIBRATED_PROVISIONAL, note: "minimum for targeted panels, whose SNPs are few and linked within amplicons; no published standard exists. Pairs below it are EXCLUDED_FEW_MARKERS"}
  da005_ld_window: {value: 100, source: SOFTWARE_DEFAULT, note: "scikit-allel locate_unlinked"}
  da005_ld_step: {value: 20, source: SOFTWARE_DEFAULT}
  da005_ld_threshold: {value: 0.1, source: SOFTWARE_DEFAULT}
  da005_min_group_size: {value: 3, source: UNCALIBRATED_PROVISIONAL}
  da005_min_independent_loci: {value: 10, source: UNCALIBRATED_PROVISIONAL, note: "targeted panels: separate target regions needed for PCA/FST; the core genome is not limited. Same floor as da006 and DA001 informative loci"}
  da006_min_independent_loci: {value: 10, source: UNCALIBRATED_PROVISIONAL, note: "targeted panels: separate target regions needed for a tree; equals da006_min_informative_sites"}
  da003_min_group_size: {value: 3, source: UNCALIBRATED_PROVISIONAL}
  da003_bootstrap_replicates: {value: 200, source: FRAMEWORK_POLICY, note: "bootstrap over samples for diversity intervals"}
  da004_dcifer_alpha: {value: 0.05, source: LITERATURE_SUPPORTED, note: "Dcifer significance level for the relatedness confidence interval (Gerlovina 2022)"}
  da004_dcifer_null_grid: {value: 1000, source: SOFTWARE_DEFAULT, note: "Dcifer ibdDat nr: grid resolution for relatedness estimates"}
  da002_min_callable_per_group: {value: 3, source: UNCALIBRATED_PROVISIONAL}
  da002_reporting_floor: {value: 0.05, source: LITERATURE_SUPPORTED, note: "MalariaGEN Pf7 2023: an allele below 5% of reads is treated as absent"}
  da002_mixed_threshold: {value: 0.95, source: LITERATURE_SUPPORTED, note: "MalariaGEN Pf7 2023: the other allele below 5% of reads is treated as absent, so >=0.95 is MUTANT rather than MIXED"}
  da008_amplification_ratio: {value: 1.5, source: UNCALIBRATED_PROVISIONAL, note: "gene depth / core depth at or above this is AMPLIFIED (with the interval check); halfway between one and two copies"}
  da008_amplification_lower: {value: 1.25, source: UNCALIBRATED_PROVISIONAL, note: "lower bootstrap bound of the ratio must reach this for AMPLIFIED"}
  da008_deletion_ratio: {value: 0.1, source: UNCALIBRATED_PROVISIONAL, note: "gene depth / core depth at or below this, with covered flanks, is DELETED"}
  da008_present_ratio: {value: 0.3, source: UNCALIBRATED_PROVISIONAL, note: "gene depth / core depth at or above this counts the gene as present; between the deletion and present ratios is UNKNOWN (ambiguous)"}
  da008_flank_min_ratio: {value: 0.3, source: UNCALIBRATED_PROVISIONAL, note: "flank depth / core depth needed before a low gene depth is called DELETED rather than UNKNOWN"}
  da008_min_core_depth: {value: 20, source: UNCALIBRATED_PROVISIONAL, note: "median core-genome depth below this leaves every locus UNKNOWN"}
  da008_flank_bp: {value: 2000, source: FRAMEWORK_POLICY, note: "length of each flank and of the window searched for junction read pairs"}
  da008_window_bp: {value: 200, source: FRAMEWORK_POLICY, note: "window size for median depths and the bootstrap interval"}
  da008_gc_windows: {value: 3000, source: FRAMEWORK_POLICY, note: "random core-genome windows per sample that give the expected depth for each GC content"}
  da008_bootstrap: {value: 1000, source: FRAMEWORK_POLICY, note: "bootstrap replicates for the depth-ratio interval"}
  da007_min_samples_per_unit: {value: 3, source: UNCALIBRATED_PROVISIONAL}
  da007_gam_min_samples: {value: 10, source: UNCALIBRATED_PROVISIONAL, note: "samples with valid place and date needed before a GAM is fitted"}
  da007_gam_max_basis: {value: 4, source: FRAMEWORK_POLICY, note: "largest basis dimension k for the time smooth"}
  da007_gam_interval_level: {value: 0.95, source: FRAMEWORK_POLICY}
  da001_moire_burnin: {value: 10000, source: SOFTWARE_DEFAULT, note: "moire run_mcmc default (Murphy and Greenhouse 2024); convergence still to be assessed per data set"}
  da001_moire_samples: {value: 1000, source: SOFTWARE_DEFAULT, note: "moire run_mcmc default samples_per_chain"}
  da001_allele_presence_floor: {value: 0.05, source: LITERATURE_SUPPORTED, note: "MalariaGEN Pf7 2023: an allele below 5% of reads is treated as absent"}
  da001_thin_bp: {value: 500, source: FRAMEWORK_POLICY, note: "distance thinning as a linkage proxy for MOIRE's independent-loci assumption"}
  da002_k13_prevalence_alert: {value: 0.05, source: LITERATURE_SUPPORTED, note: "WHO: more than 5% of patients carrying a validated PfKelch13 marker is the molecular criterion for suspected artemisinin partial resistance; used to flag prevalence rows, never to decide resistance"}
  da004_related_ibd: {value: 0.5, source: LITERATURE_SUPPORTED, note: "IBD >= 0.5 as the reporting convention for closely related pairs; display label only"}
  da004_clonal_ibd: {value: 0.9, source: LITERATURE_SUPPORTED, note: "IBD >= 0.9 as the reporting convention for near-identical (clonal) pairs; display label only"}
  da006_ufboot_support: {value: 95, source: LITERATURE_SUPPORTED, note: "IQ-TREE guidance: rely on a branch only at UFBoot >= 95 (Hoang 2018)"}
  da006_alrt_support: {value: 80, source: LITERATURE_SUPPORTED, note: "IQ-TREE guidance: SH-aLRT >= 80 (Guindon 2010)"}
