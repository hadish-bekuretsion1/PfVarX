<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PfVarX configuration</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body><main>
<h1>PfVarX configuration</h1>
<p>Save the project settings and create input folders. Register inputs, validate and prepare from the terminal.</p>
<label>Template <select id="purpose"><option>analysis</option><option>benchmarking</option></select></label>
<section id="raw-data-location" aria-label="Raw data location" hidden>
<label for="raw-data-directory">Raw data folder</label>
<input id="raw-data-directory" readonly aria-describedby="raw-data-help">
<small id="raw-data-help"></small>
<p>The path is relative to your study workspace. The folder is created when you save.</p>
</section>
<form id="editor"></form>
<label><input id="replace" type="checkbox"> Save with backup if existing YAML differs</label>
<p id="status" role="status" aria-live="polite"></p>
<button id="save" disabled>Create Configuration and Input Directories</button>
<details open><summary>Configuration summary</summary><pre id="summary"></pre></details>
<pre id="result" aria-live="polite"></pre>
</main></body></html>
