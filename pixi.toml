[tasks]
config-init = "pfvarx config-init"
init = "pfvarx init"
check-layout = "pfvarx check-layout"
validate = "pfvarx validate"
prepare = "pfvarx prepare"
ready = "pfvarx ready"
dry-run = "pfvarx dry-run"
pipeline = "pfvarx pipeline"
report = "pfvarx report"
run-verify = "pfvarx run-verify"
status = "pfvarx status"
fixture = "pfvarx fixture"
benchmark-partition = "pfvarx benchmark-partition"
benchmark-evaluate = "pfvarx benchmark-evaluate"
benchmark-resources = "pfvarx benchmark-resources"
test = "pytest -q tests"
test-unit = "pytest -q tests/unit"
lint = "ruff check src tests scripts bootstrap.py pfvarx"
typecheck = "mypy src/pfvarx"
verify = "python scripts/verify.py"
package = "python scripts/package.py"

workspace-init = "pfvarx workspace-init"
discover-inputs = "pfvarx discover-inputs"
register-inputs = "pfvarx register-inputs"
fetch-input = "pfvarx fetch-input"
verify-prepared = "pfvarx verify-prepared"
orchestrate = "pfvarx orchestrate"
cleanup = "pfvarx cleanup"

