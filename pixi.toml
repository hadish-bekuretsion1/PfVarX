[workspace]
name = "pfvarx"
description = "PfVarX: assay-aware SNP and small-indel analysis of Plasmodium falciparum short-read data"
channels = ["conda-forge", "bioconda"]
channel-priority = "strict"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
conda-pypi-map = false

[dependencies]
python = "3.12.*"
pip = "*"
hatchling = ">=1.25,<2"
pydantic = ">=2.7,<3"
typer = ">=0.12,<1"
pyyaml = ">=6,<7"
pysam = ">=0.22,<0.24"
htslib = ">=1.21,<2"

# Every pipeline run: the workflow engine and the alignment-processing tools. The "control"
# environment (configuration, GUI and validation only) has none of them; the tools are added
# by ./pfvarx install-tools (GUI: Install required tools) for the saved configuration.
[feature.pipeline.dependencies]
snakemake-minimal = ">=9,<10"
samtools = ">=1.21,<2"
# picard-slim: the same Picard without its R dependency (R is used only for optional plots;
# PfVarX runs MarkDuplicates and CreateSequenceDictionary).
picard-slim = "3.*"
mosdepth = ">=0.3.10"

[pypi-dependencies]
pfvarx = { path = ".", editable = true }

# FO002 and later: the variant caller (numpy, scipy) and VCF normalisation and merging
# (bcftools). FO001 (alignment and QC only) installs without them.
[feature.calling.dependencies]
numpy = ">=1.26,<3"
scipy = ">=1.11,<2"
# Compiles the pair-HMM indel rescoring (same results, faster); the caller falls back to numpy without it.
numba = ">=0.60,<1"
bcftools = ">=1.21,<2"

[feature.targeted.dependencies]
# fgbio-minimal: the same fgbio without R (R draws optional metric plots only).
fgbio-minimal = "*"

[feature.annotation.dependencies]
snpeff = "5.*"

[feature.coi.dependencies]
r-base = "4.*"
r-jsonlite = "*"
r-moire = "*"

[feature.related.dependencies]
r-dcifer = "*"
hmmibd = "*"

[feature.structure.dependencies]
scikit-allel = "*"

[feature.phylogeny.dependencies]
iqtree = "2.*"

[feature.spatial.dependencies]
r-base = "4.*"
r-jsonlite = "*"
r-mgcv = "*"

[feature.bench.dependencies]
rtg-tools = "*"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
mypy = "*"
types-pyyaml = "*"

[feature.reads.dependencies]
bwa-mem2 = "2.*"
fastp = "*"

[environments]
# Configuration, GUI and validation only; tools follow with ./pfvarx install-tools.
control = { solve-group = "main" }
# FO001: alignment and QC only (no caller, bcftools, numpy or scipy).
alignment-qc = { features = ["pipeline", "reads"], solve-group = "main" }
alignment-qc-targeted = { features = ["pipeline", "reads", "targeted"], solve-group = "main" }
default = { features = ["pipeline", "calling", "targeted", "annotation", "coi", "related", "structure", "phylogeny", "spatial", "bench", "dev", "reads"], solve-group = "main" }
core = { features = ["pipeline", "calling", "reads"], solve-group = "main" }
aligned = { features = ["pipeline", "calling"], solve-group = "main" }
selected-bench = { features = ["pipeline", "calling", "bench"], solve-group = "main" }
selected-bench-reads = { features = ["pipeline", "calling", "bench", "reads"], solve-group = "main" }
