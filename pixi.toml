[workspace]
name = "pfvarx"
version = "0.0.0"
description = "PfVarX: assay-aware SNP and small-indel analysis of Plasmodium falciparum short-read data"
channels = ["conda-forge", "bioconda"]
channel-priority = "strict"
platforms = ["linux-64"]
conda-pypi-map = false

[dependencies]
python = "3.12.*"
pip = "*"
hatchling = ">=1.25,<2"
pydantic = ">=2.7,<3"
typer = ">=0.12,<1"
pyyaml = ">=6,<7"
numpy = ">=1.26,<3"
scipy = ">=1.11,<2"
pysam = ">=0.22,<0.24"
snakemake-minimal = ">=9,<10"
samtools = ">=1.21,<2"
bcftools = ">=1.21,<2"
htslib = ">=1.21,<2"
picard = "3.*"
mosdepth = ">=0.3.10"

[pypi-dependencies]
pfvarx = { path = ".", editable = true }

[feature.targeted.dependencies]
fgbio = "*"

[feature.annotation.dependencies]
snpeff = "5.*"

[feature.coi.dependencies]
r-base = "4.*"
r-jsonlite = "*"
r-moire = "*"

[feature.related.dependencies]
r-dcifer = "*"
hmmibd = "*"

[feature.structure.dependencies]
scikit-allel = "*"

[feature.phylogeny.dependencies]
iqtree = "2.*"

[feature.spatial.dependencies]
r-base = "4.*"
r-jsonlite = "*"
r-mgcv = "*"

[feature.bench.dependencies]
rtg-tools = "*"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
mypy = "*"
types-pyyaml = "*"

[feature.reads.dependencies]
bwa-mem2 = "2.*"
fastp = "*"

[environments]
default = { features = ["targeted", "annotation", "coi", "related", "structure", "phylogeny", "spatial", "bench", "dev", "reads"], solve-group = "main" }
core = { features = ["reads"], solve-group = "main" }
aligned = { solve-group = "main" }
selected-bench = { features = ["bench"], solve-group = "main" }
selected-bench-reads = { features = ["bench", "reads"], solve-group = "main" }
selected-annotation = { features = ["annotation"], solve-group = "main" }
selected-annotation-reads = { features = ["annotation", "reads"], solve-group = "main" }
selected-annotation-bench = { features = ["annotation", "bench"], solve-group = "main" }
selected-annotation-bench-reads = { features = ["annotation", "bench", "reads"], solve-group = "main" }
selected-annotation-spatial = { features = ["annotation", "spatial"], solve-group = "main" }
