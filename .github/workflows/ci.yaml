name: PfVarX CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.83.0
          locked: true
          environments: default
      - name: Lint
        run: pixi run lint
      - name: Type checking
        run: pixi run typecheck
      - name: Import and help smoke
        run: pixi run pfvarx --help && pixi run pfvarx version
      - name: Unit and scientific tests
        run: pixi run pytest -q tests/unit tests/scientific
      - name: Workflow dry run on the synthetic fixture
        run: pixi run pytest -q tests/integration
      - name: Validate software-only source archive
        shell: bash
        run: |
          version="$(pixi run --locked pfvarx version)"
          pixi run python scripts/package.py --output "$RUNNER_TEMP/pfvarx-release"
          cd "$RUNNER_TEMP/pfvarx-release"
          sha256sum -c "pfvarx-${version}-source.zip.sha256"
          python -m zipfile -e "pfvarx-${version}-source.zip" unpacked
          python unpacked/pfvarx/scripts/package.py --check
